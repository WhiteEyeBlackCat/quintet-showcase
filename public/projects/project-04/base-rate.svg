<text x="520" y="420" font-size="36" fill="#b7bcdb" font-weight="400" text-anchor="start" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">180</text>
<text x="760" y="420" font-size="36" fill="#FF7A59" font-weight="600" text-anchor="start" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">490</text>
<rect x="1000" y="384" width="113" height="46" rx="8" fill="#F5C451" fill-opacity="0.48"/>
<text x="1126.98" y="420" font-size="32" fill="#eef0ff" font-weight="700" text-anchor="start" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">26.9%</text>
<path d="M100 480 H1500" stroke="#fff" stroke-opacity="0.08"/>
<text x="160" y="540" font-size="40" fill="#eef0ff" font-weight="700" text-anchor="start" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">99%</text>
<text x="520" y="540" font-size="36" fill="#b7bcdb" font-weight="400" text-anchor="start" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">180</text>
<text x="760" y="540" font-size="36" fill="#b7bcdb" font-weight="400" text-anchor="start" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">98</text>
<rect x="1000" y="504" width="272" height="46" rx="8" fill="#F5C451" fill-opacity="0.67"/>
<text x="1285.74" y="540" font-size="32" fill="#eef0ff" font-weight="700" text-anchor="start" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">64.7%</text>
<path d="M100 600 H1500" stroke="#fff" stroke-opacity="0.08"/>
<text x="160" y="660" font-size="40" fill="#eef0ff" font-weight="700" text-anchor="start" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">99.9%</text>
<text x="520" y="660" font-size="36" fill="#b7bcdb" font-weight="400" text-anchor="start" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">180</text>
<text x="760" y="660" font-size="36" fill="#b7bcdb" font-weight="400" text-anchor="start" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">9.8</text>
<rect x="1000" y="624" width="398" height="46" rx="8" fill="#F5C451" fill-opacity="0.82"/>
<text x="1412.16" y="660" font-size="32" fill="#eef0ff" font-weight="700" text-anchor="start" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">94.8%</text>
<rect x="100" y="760" width="1400" height="130" rx="18" fill="#10142b" fill-opacity="0.3" stroke="#FF7A59" stroke-opacity="0.75" stroke-width="1.5"/>
<text x="140" y="815" font-size="26" fill="#eef0ff" font-weight="600" text-anchor="start" fill-opacity="1">95% 特異度的偵測器，發出的警示有 73% 是誤報，督導幾週內就不會再看。</text>
<text x="140" y="860" font-size="24" fill="#b7bcdb" font-weight="400" text-anchor="start" fill-opacity="1">→ 改做複聽清單：只調整督導本來就在做的抽聽順序，督導的確認與駁回再拿來改進模型。</text>
<text x="100" y="950" font-size="20" fill="#8a90b4" font-weight="400" text-anchor="start" fill-opacity="1">來源：SurveyVoiceAI ticket 13〈Objection 1 — the base rate decides the product〉</text>
