<rect width="1600" height="1000" fill="url(#brbg)"/><rect width="1600" height="1000" fill="url(#brglow)"/><rect width="1600" height="1000" fill="url(#brglow2)"/>
<g font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif">
<text x="100" y="120" font-size="22" fill="#F5C451" font-weight="600" text-anchor="start" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">DESIGN TARGET · TICKET 13</text><text x="100" y="182" font-size="50" fill="#eef0ff" font-weight="700" text-anchor="start" fill-opacity="1">警示的價值由基礎率決定</text><text x="100" y="232" font-size="26" fill="#b7bcdb" font-weight="400" text-anchor="start" fill-opacity="1">假設訪員真實錯誤率 2%、偵測靈敏度 90%，每 10,000 題</text>
<text x="160" y="330" font-size="24" fill="#8a90b4" font-weight="600" text-anchor="start" fill-opacity="1">偵測特異度</text>
<text x="520" y="330" font-size="24" fill="#8a90b4" font-weight="600" text-anchor="start" fill-opacity="1">真陽性</text>
<text x="760" y="330" font-size="24" fill="#8a90b4" font-weight="600" text-anchor="start" fill-opacity="1">假陽性</text>
<text x="1000" y="330" font-size="24" fill="#8a90b4" font-weight="600" text-anchor="start" fill-opacity="1">警示可信度（PPV）</text>
<path d="M100 360 H1500" stroke="#fff" stroke-opacity="0.08"/>
