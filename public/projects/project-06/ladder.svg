<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="六階提問：閉卷寫出定義、用白話解釋、區分相近概念、情境應用、說出何時失效、寫成論文中的一句話">
<title>六階提問：閉卷寫出定義、用白話解釋、區分相近概念、情境應用、說出何時失效、寫成論文中的一句話</title>
<rect width="1600" height="1000" fill="#F2ECDF"/>
<g font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif">
<text x="800" y="92" font-size="54" fill="#2C1D12" font-weight="800" text-anchor="middle" fill-opacity="1">六階提問：懂到哪裡，問到哪裡</text><text x="800" y="140" font-size="24" fill="#6B4C33" font-weight="400" text-anchor="middle" fill-opacity="1">The Question Ladder · 以論文裡任一個核心概念 X 為例</text>
<rect x="100" y="196" width="1220" height="90" rx="10" fill="#FAF5EB" stroke="#B89B7A" stroke-width="2"/>
<circle cx="152" cy="241" r="28" fill="#2C1D12"/>
<text x="152" y="252" font-size="30" fill="#FAF5EB" font-weight="800" text-anchor="middle" fill-opacity="1">1</text>
<text x="204" y="251" font-size="27" fill="#2C1D12" font-weight="700" text-anchor="start" fill-opacity="1">閉卷寫出定義</text>
<text x="530" y="250" font-size="23" fill="#6B4C33" font-weight="400" text-anchor="start" fill-opacity="1">不看資料，寫出 X 的定義</text>
<rect x="136" y="302" width="1220" height="90" rx="10" fill="#FAF5EB" stroke="#B89B7A" stroke-width="2"/>
<circle cx="188" cy="347" r="28" fill="#2C1D12"/>
<text x="188" y="358" font-size="30" fill="#FAF5EB" font-weight="800" text-anchor="middle" fill-opacity="1">2</text>
<text x="240" y="357" font-size="27" fill="#2C1D12" font-weight="700" text-anchor="start" fill-opacity="1">用白話解釋</text>
<text x="566" y="356" font-size="23" fill="#6B4C33" font-weight="400" text-anchor="start" fill-opacity="1">講給大學生聽：X 為什麼存在？少了它會怎樣？</text>
<rect x="172" y="408" width="1220" height="90" rx="10" fill="#FAF5EB" stroke="#B89B7A" stroke-width="2"/>
<circle cx="224" cy="453" r="28" fill="#2C1D12"/>
<text x="224" y="464" font-size="30" fill="#FAF5EB" font-weight="800" text-anchor="middle" fill-opacity="1">3</text>
<text x="276" y="463" font-size="27" fill="#2C1D12" font-weight="700" text-anchor="start" fill-opacity="1">區分相近概念</text>
<text x="602" y="462" font-size="23" fill="#6B4C33" font-weight="400" text-anchor="start" fill-opacity="1">X 和最容易混淆的 Y 差在哪裡？</text>
<rect x="208" y="514" width="1220" height="90" rx="10" fill="#FAF5EB" stroke="#B89B7A" stroke-width="2"/>
<circle cx="260" cy="559" r="28" fill="#2C1D12"/>
<text x="260" y="570" font-size="30" fill="#FAF5EB" font-weight="800" text-anchor="middle" fill-opacity="1">4</text>
<text x="312" y="569" font-size="27" fill="#2C1D12" font-weight="700" text-anchor="start" fill-opacity="1">情境應用</text>
<text x="638" y="568" font-size="23" fill="#6B4C33" font-weight="400" text-anchor="start" fill-opacity="1">遇到一個新情境，該不該用 X？怎麼用？</text>
<rect x="244" y="620" width="1220" height="90" rx="10" fill="#FAF5EB" stroke="#A83A2E" stroke-width="3"/>
<circle cx="296" cy="665" r="28" fill="#A83A2E"/>
<text x="296" y="676" font-size="30" fill="#FAF5EB" font-weight="800" text-anchor="middle" fill-opacity="1">5</text>
<text x="348" y="675" font-size="27" fill="#2C1D12" font-weight="700" text-anchor="start" fill-opacity="1">說出何時失效</text>
<text x="674" y="674" font-size="23" fill="#2C1D12" font-weight="600" text-anchor="start" fill-opacity="1">在什麼條件下，X 會給出錯誤的結果？</text>
<rect x="280" y="726" width="1220" height="90" rx="10" fill="#FAF5EB" stroke="#A83A2E" stroke-width="3"/>
<circle cx="332" cy="771" r="28" fill="#A83A2E"/>
<text x="332" y="782" font-size="30" fill="#FAF5EB" font-weight="800" text-anchor="middle" fill-opacity="1">6</text>
<text x="384" y="781" font-size="27" fill="#2C1D12" font-weight="700" text-anchor="start" fill-opacity="1">寫成論文中的一句話</text>
<text x="710" y="780" font-size="23" fill="#2C1D12" font-weight="600" text-anchor="start" fill-opacity="1">用一句經得起口試追問的話，說明 X 對你的研究</text>
<text x="800" y="880" font-size="25" fill="#A83A2E" font-weight="700" text-anchor="middle" fill-opacity="1">第 5、6 層最能分辨「看過」和「真的懂」；卡在哪一層，就是下一步要補的地方。</text>
</g>
</svg>
