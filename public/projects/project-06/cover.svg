<text x="1140" y="486" font-size="22" fill="#eef0ff" font-weight="500" text-anchor="middle" fill-opacity="1">核心論文</text>
<circle cx="880" cy="370" r="50" fill="#8B7CFF" fill-opacity="0.18" stroke="#8B7CFF" stroke-opacity="0.9" stroke-width="2"/>
<text x="880" y="377" font-size="19" fill="#eef0ff" font-weight="700" text-anchor="middle" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">middle</text>
<text x="880" y="302" font-size="22" fill="#eef0ff" font-weight="500" text-anchor="middle" fill-opacity="1">背景理論</text>
<circle cx="1400" cy="370" r="50" fill="#8B7CFF" fill-opacity="0.18" stroke="#8B7CFF" stroke-opacity="0.9" stroke-width="2"/>
<text x="1400" y="377" font-size="19" fill="#eef0ff" font-weight="700" text-anchor="middle" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">middle</text>
<text x="1400" y="302" font-size="22" fill="#eef0ff" font-weight="500" text-anchor="middle" fill-opacity="1">研究方法</text>
<circle cx="860" cy="730" r="44" fill="#8a90b4" fill-opacity="0.18" stroke="#8a90b4" stroke-opacity="0.9" stroke-width="2"/>
<text x="860" y="737" font-size="19" fill="#eef0ff" font-weight="700" text-anchor="middle" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">draft</text>
<text x="860" y="808" font-size="22" fill="#b7bcdb" font-weight="500" text-anchor="middle" fill-opacity="1">相關研究</text>
<circle cx="1420" cy="730" r="44" fill="#8a90b4" fill-opacity="0.18" stroke="#8a90b4" stroke-opacity="0.9" stroke-width="2"/>
<text x="1420" y="737" font-size="19" fill="#eef0ff" font-weight="700" text-anchor="middle" fill-opacity="1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">draft</text>
<text x="1420" y="808" font-size="22" fill="#b7bcdb" font-weight="500" text-anchor="middle" fill-opacity="1">相關研究</text>
<circle cx="1140" cy="850" r="26" fill="#8a90b4" fill-opacity="0.18" stroke="#8a90b4" stroke-opacity="0.9" stroke-width="2"/>
<text x="1140" y="910" font-size="22" fill="#b7bcdb" font-weight="500" text-anchor="middle" fill-opacity="1">下一篇要讀的</text>
<text x="100" y="950" font-size="20" fill="#8a90b4" font-weight="400" text-anchor="start" fill-opacity="1">圓點＝wiki 頁，依重要程度分成 draft／middle／deep；虛線＝已被引用、還沒寫的頁</text>
</g>
