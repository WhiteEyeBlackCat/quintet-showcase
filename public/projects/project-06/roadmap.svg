<text x="800" y="890" font-size="23" fill="#6B4C33" font-weight="500" text-anchor="middle" fill-opacity="1">先學什麼由研究目標決定；份量控制在一次讀得完的範圍，順序依每次再考的結果隨時調整。</text>
